; PlatformIO Project Configuration File
; Project: ATtiny85 Instant Sound Horn (Duck / Cow Sound FX)
; Platform: Atmel AVR (ATtiny85 bare-metal)
; Author: Ty (TU LAM DIEN TU)

[platformio]
default_envs = esp32c3_supermini

; ==============================================================================
; Môi trường ESP32-C3 Super Mini (Âm thanh vào PAM8403, Flash 4MB, RISC-V 160MHz)
; ==============================================================================
[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BOOTLOADER_LOG_LEVEL_NONE=1
    -O2


