; PlatformIO Project Configuration File
; Project: ATtiny85 Instant Sound Horn (Duck / Cow Sound FX)
; Platform: Atmel AVR (ATtiny85 bare-metal)
; Author: Ty (TU LAM DIEN TU)

[platformio]
default_envs = esp32c3_supermini

; ==============================================================================
; Môi trường ESP32-C3 Super Mini (Âm thanh vào PAM8403, Flash 4MB, RISC-V 160MHz)
; ==============================================================================
[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BOOTLOADER_LOG_LEVEL_NONE=1
    -O2


; ==============================================================================
; Môi trường nạp trực tiếp qua cổng USB máy tính (Digispark Micronucleus)
; ==============================================================================
[env:digispark_usb]
platform = atmelavr
board = digispark-tiny
framework = arduino
build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; ==============================================================================
; Môi trường chuẩn: ATtiny85 chạy dao động nội 8MHz (Calibrated Internal RC 8MHz)
; ==============================================================================
[env:attiny85_8mhz]
platform = atmelavr
board = attiny85
framework = arduino

; Tần số CPU: 8MHz
board_build.f_cpu = 8000000L

; Cấu hình Fuse Bits cho ATtiny85 (Khởi động tức thì < 2ms):
; Low Fuse:  0xE2 (Internal RC 8MHz, SUT=00: Start-up time 6 CK + 14 CK + 0ms) -> CỰC NHANH
; High Fuse: 0xDF (BOD disabled, SPI programming enabled, Reset pin enabled)
; Extended:  0xFF (Self-programming disabled)
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; Tối ưu hóa dung lượng biên dịch
build_unflags = -Os
build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DF_CPU=8000000L

; Tùy chọn nạp qua Arduino as ISP (Arduino Nano / Uno làm mạch nạp)
; Bỏ chú thích các dòng dưới khi nạp qua Arduino as ISP
; upload_protocol = stk500v1
; upload_flags =
;     -PCOM3
;     -b19200

; ==============================================================================
; Môi trường nạp qua USBasp
; ==============================================================================
[env:attiny85_usbasp]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 8000000L
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF
build_flags = 
    -Os
    -DF_CPU=8000000L
upload_protocol = usbasp
upload_flags =
    -B 4
